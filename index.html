<!-- Set theme + language before first paint to avoid a flash -->
<script>
  (function () {
    try {
      var t = localStorage.getItem("portfolio-theme");
      if (t === "light") document.documentElement.setAttribute("data-theme", "light");
      var l = localStorage.getItem("portfolio-lang");
      if (l === "ar") {
        document.documentElement.lang = "ar";
        document.documentElement.dir = "rtl";
      }
    } catch (e) {}
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<main>

  <!-- ============ 01 HOME / HERO ============ -->
  <section class="hero" id="home">
    <div class="hero-grid"></div>
    <div class="hero-inner">

      <div class="hero-copy">
        <p class="hero-eyebrow"><span class="pulse"></span><span data-ui="openTo"></span></p>
        <p class="hero-greeting" data-profile="greeting"></p>
        <h1 class="hero-title" data-profile="name"></h1>
        <p class="hero-role" data-profile="title"></p>
        <p class="hero-usp" data-profile="uspShort"></p>

        <div class="hero-actions">
          <a href="#projects" class="btn btn-primary" data-ui="viewWork"></a>
          <a href="assets/Asem_Mohamed_CV.pdf" download class="btn btn-ghost" data-ui="downloadCV"></a>
        </div>

        <dl class="hero-stats" id="heroStats"></dl>
      </div>

      <div class="hero-terminal" role="img" aria-label="Terminal window summarising the profile">
        <div class="terminal-bar">
          <span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span>
          <span class="terminal-title">asem@cloud-engineer: ~</span>
        </div>
        <div class="terminal-body" id="terminalBody"></div>
      </div>

    </div>
  </section>

  <!-- ============ 02 ABOUT ============ -->
  <section class="section" id="about">
    <div class="section-inner">
      <div class="section-head">
        <span class="section-kicker" data-sec="about.kicker"></span>
        <h2 class="section-title" data-sec="about.hook"></h2>
      </div>

      <div class="about-grid">
        <article class="about-card about-card-main">
          <p class="about-lead" data-about="whoIAm"></p>
          <p class="about-body" data-about="specialize"></p>

          <blockquote class="about-usp" data-profile="usp"></blockquote>

          <p class="about-body" data-about="different"></p>
          <div class="tag-row" id="aboutTags"></div>
        </article>

        <aside class="about-card about-side">
          <div class="about-avatar" id="aboutAvatar">A·G</div>
          <p class="about-side-name" data-profile="fullName"></p>
          <p class="about-side-role" data-profile="title"></p>
          <ul class="about-facts" id="aboutFacts"></ul>
        </aside>
      </div>
    </div>
  </section>

  <!-- ============ 03 EDUCATION & CERTIFICATES ============ -->
  <section class="section section-alt" id="education">
    <div class="section-inner">
      <div class="section-head">
        <span class="section-kicker" data-sec="education.kicker"></span>
        <h2 class="section-title" data-sec="education.hook"></h2>
      </div>

      <div class="edu-split">
        <div class="edu-col">
          <h3 class="col-heading" data-ui="eduTitle"></h3>
          <div class="edu-card" id="eduCard"></div>
        </div>
        <div class="edu-col">
          <h3 class="col-heading" data-ui="certsTitle"></h3>
          <p class="col-note" data-ui="certClick"></p>
          <div class="cert-grid" id="certGrid"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 04 SKILLS ============ -->

    <div class="section-inner">

        <span class="section-kicker" data-sec="skills.kicker"></span>
        <h2 class="section-title" data-sec="skills.hook"></h2>
        <p class="section-sub" data-sec="skills.sub"></p>
      </div>
      <div class="skills-grid" id="skillsGrid"></div>
    </div>

  <section class="section" id="contact">
    <div class="section-inner contact-grid">
      <div class="contact-info">
        <span class="section-kicker" data-sec="contact.kicker"></span>
        <h2 class="section-title" data-sec="contact.hook"></h2>
        <p class="section-sub" data-sec="contact.sub"></p>
        <ul class="contact-list" id="contactList"></ul>
      </div>

      <form class="contact-form" id="contactForm" novalidate>
        <div class="form-row">
          <input type="text" id="cf-name" name="name" required autocomplete="name" data-ph="formName">
          <span class="form-error" data-for="cf-name"></span>
        </div>
        <div class="form-row">
          <input type="email" id="cf-email" name="email" required autocomplete="email" data-ph="formEmail">
          <span class="form-error" data-for="cf-email"></span>
        </div>
        <div class="form-row">
          <input type="text" id="cf-subject" name="subject" required data-ph="formSubject">
          <span class="form-error" data-for="cf-subject"></span>
        </div>
        <div class="form-row">
          <textarea id="cf-message" name="message" rows="5" required data-ph="formMessage"></textarea>
          <span class="form-error" data-for="cf-message"></span>
        </div>
        <button type="submit" class="btn btn-primary form-submit" data-ui="formSend"></button>
        <p class="form-note" data-ui="formNote"></p>
      </form>
    </div>
  </section>
